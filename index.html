<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>動画投稿シミュレーション</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #68738a;
      --accent: #ff355d;
      --accent-dark: #d91f47;
      --line: #e6e9f2;
      --good: #17a673;
      --warn: #cf7b00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #ffe1e8, transparent 32rem), var(--bg);
      color: var(--text);
    }

    header {
      padding: 32px clamp(16px, 5vw, 56px) 20px;
    }

    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 48px); }
    p { margin: 0; color: var(--muted); line-height: 1.65; }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 430px) 1fr;
      gap: 24px;
      padding: 0 clamp(16px, 5vw, 56px) 48px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(30, 38, 62, 0.08);
      padding: 24px;
    }

    .stack { display: grid; gap: 16px; }
    label { display: grid; gap: 8px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 120px; resize: vertical; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }
    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: wait; transform: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: #f8f9fd;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    .stat strong { display: block; font-size: clamp(20px, 3vw, 32px); }
    .stat span { color: var(--muted); font-size: 13px; }

    .video-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      background: #fff;
    }
    .video-card h2 { margin: 0 0 8px; }
    .video-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .comment {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff8aa3, #876cff);
      color: white;
      font-weight: 900;
    }
    .comment-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .author { font-weight: 800; }
    .badge { border-radius: 999px; padding: 2px 8px; font-size: 12px; background: #eef1f8; color: var(--muted); }
    .badge.positive { color: var(--good); background: #eaf8f3; }
    .badge.critical { color: var(--warn); background: #fff4df; }
    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>動画投稿シミュレーション</h1>
    <p>登録者数・合計視聴回数を設定し、動画タイトルと内容を入力して投稿すると、AI APIを使ったコメント欄をシミュレーションできます。</p>
  </header>

  <main>
    <section class="panel stack" aria-label="投稿フォーム">
      <label>登録者数
        <input id="subscribers" type="number" min="0" value="12000" />
      </label>
      <label>合計視聴回数
        <input id="totalViews" type="number" min="0" value="850000" />
      </label>
      <label>動画タイトル
        <input id="title" maxlength="120" placeholder="例: 1週間AIだけで動画を作ってみた" />
      </label>
      <label>動画の内容
        <textarea id="content" maxlength="4000" placeholder="動画の企画、見どころ、想定する視聴者などを書いてください"></textarea>
      </label>
      <button id="postButton">動画を追加</button>
      <p id="status" role="status"></p>
    </section>

    <section class="panel" aria-label="チャンネルとコメント欄">
      <div class="stats">
        <div class="stat"><strong id="statSubscribers">12,000</strong><span>登録者</span></div>
        <div class="stat"><strong id="statTotalViews">850,000</strong><span>合計視聴回数</span></div>
        <div class="stat"><strong id="statVideos">0</strong><span>投稿動画</span></div>
      </div>
      <div id="timeline" class="empty">まだ動画がありません。左のフォームから最初の動画を投稿してください。</div>
    </section>
  </main>

  <template id="videoTemplate">
    <article class="video-card">
      <h2></h2>
      <p class="summary"></p>
      <div class="video-meta"></div>
      <div class="comments"></div>
    </article>
  </template>

  <script>
    const state = { videos: [] };
    const formatter = new Intl.NumberFormat("ja-JP");
    const postButton = document.querySelector("#postButton");
    const statusEl = document.querySelector("#status");
    const timeline = document.querySelector("#timeline");

    function numberValue(selector) {
      return Math.max(0, Number(document.querySelector(selector).value || 0));
    }

    function updateStats() {
      const subscribers = numberValue("#subscribers");
      const totalViews = numberValue("#totalViews") + state.videos.reduce((sum, video) => sum + video.views, 0);
      document.querySelector("#statSubscribers").textContent = formatter.format(subscribers);
      document.querySelector("#statTotalViews").textContent = formatter.format(totalViews);
      document.querySelector("#statVideos").textContent = formatter.format(state.videos.length);
    }

    function estimateViews(subscribers, totalViews) {
      const base = Math.max(100, subscribers * (0.08 + Math.random() * 0.55));
      const channelBoost = Math.min(totalViews * 0.015, subscribers * 5 + 5000);
      return Math.round(base + Math.random() * channelBoost);
    }

    async function requestComments(video) {
      const response = await fetch("/api/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: video.title,
          content: video.content,
          subscribers: video.subscribers,
          total_views: video.totalViews,
          video_views: video.views,
          comment_count: 8,
        }),
      });
      if (!response.ok) throw new Error("コメント生成に失敗しました");
      return response.json();
    }

    function render() {
      updateStats();
      if (state.videos.length === 0) return;
      timeline.className = "";
      timeline.innerHTML = "";
      const template = document.querySelector("#videoTemplate");
      state.videos.forEach((video) => {
        const node = template.content.cloneNode(true);
        node.querySelector("h2").textContent = video.title;
        node.querySelector(".summary").textContent = video.content;
        node.querySelector(".video-meta").innerHTML = `
          <span>${formatter.format(video.views)} 回視聴</span>
          <span>${video.source === "openai" ? "AI API生成コメント" : "デモコメント"}</span>
          <span>${new Date(video.createdAt).toLocaleString("ja-JP")}</span>
        `;
        const comments = node.querySelector(".comments");
        video.comments.forEach((comment) => {
          const item = document.createElement("div");
          item.className = "comment";
          item.innerHTML = `
            <div class="avatar">${comment.author.slice(0, 1)}</div>
            <div>
              <div class="comment-head">
                <span class="author"></span>
                <span class="badge ${comment.sentiment}">${comment.sentiment}</span>
                <span class="badge">${formatter.format(comment.likes)} likes</span>
                <span class="badge">${comment.minutes_ago}分前</span>
              </div>
              <p></p>
            </div>
          `;
          item.querySelector(".author").textContent = comment.author;
          item.querySelector("p").textContent = comment.body;
          comments.appendChild(item);
        });
        timeline.appendChild(node);
      });
    }

    postButton.addEventListener("click", async () => {
      const title = document.querySelector("#title").value.trim();
      const content = document.querySelector("#content").value.trim();
      const subscribers = numberValue("#subscribers");
      const totalViews = numberValue("#totalViews");
      if (!title || !content) {
        statusEl.textContent = "タイトルと内容を入力してください。";
        return;
      }

      postButton.disabled = true;
      statusEl.textContent = "投稿中… AIコメント欄を生成しています。";
      const video = {
        title,
        content,
        subscribers,
        totalViews,
        views: estimateViews(subscribers, totalViews),
        createdAt: Date.now(),
      };

      try {
        const result = await requestComments(video);
        state.videos.unshift({ ...video, comments: result.comments, source: result.source });
        document.querySelector("#title").value = "";
        document.querySelector("#content").value = "";
        statusEl.textContent = "投稿しました。右側でコメント欄を確認できます。";
        render();
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        postButton.disabled = false;
      }
    });

    ["#subscribers", "#totalViews"].forEach((selector) => {
      document.querySelector(selector).addEventListener("input", updateStats);
    });
    updateStats();
  </script>
</body>
</html>
